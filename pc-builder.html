    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow-x: hidden;
      line-height: 1.5;
      transition: background-color 0.5s ease, color 0.3s ease;
    }
    a { text-decoration: none; color: inherit; }

    :root {
      --bg: #0b0b0f;
      --bg-secondary: #111216;
      --card-bg: rgba(20, 22, 27, 0.4);
      --text: #fff;
      --muted: #a0a0b0;
      --accent: #ffd84d;
      --accent-dark: #e6c43d;
      --accent-glow: 0 0 20px rgba(255,216,77,0.5);
      --border-color: rgba(255,255,255,0.08);
      --card-hover: rgba(30, 32, 40, 0.6);
      --transition: 0.4s cubic-bezier(0.2, 0.9, 0.3, 1);
      --lamp-color: #ffd84d;
      --lamp-off-color: #94a3b8;
      --header-bg: rgba(11, 11, 15, 0.5);
      --card-shadow: 0 8px 32px rgba(0,0,0,0.15);
      --glass-blur: blur(20px);
      --glass-border: 1px solid rgba(255,255,255,0.06);
      --glass-bg: rgba(20, 22, 27, 0.3);
    }
    body.light-mode {
      --bg: #f8fafc;
      --bg-secondary: #ffffff;
      --card-bg: rgba(255, 255, 255, 0.9);
      --text: #0f172a;
      --muted: #475569;
      --accent: #eab308;
      --accent-dark: #ca8a04;
      --accent-glow: 0 0 20px rgba(234,179,8,0.2);
      --border-color: rgba(0,0,0,0.1);
      --card-hover: rgba(255, 255, 255, 1);
      --lamp-color: #eab308;
      --lamp-off-color: #64748b;
      --header-bg: rgba(255, 255, 255, 0.85);
      --card-shadow: 0 8px 32px rgba(0,0,0,0.05);
      --glass-border: 1px solid rgba(0,0,0,0.08);
      --glass-bg: rgba(255, 255, 255, 0.7);
    }

    /* Music toggle & lamp (same as index) */
    .autoplay-hint {
      position: fixed;
      bottom: 100px;
      left: 20px;
      z-index: 9999;
      background: var(--glass-bg);
      backdrop-filter: var(--glass-blur);
      border: var(--glass-border);
      border-radius: 40px;
      padding: 10px 18px;
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 13px;
      font-weight: 500;
      color: var(--text);
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      pointer-events: none;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease, visibility 0.2s;
    }
    .autoplay-hint.show { opacity: 1; visibility: visible; pointer-events: auto; }
    .music-toggle {
      position: fixed;
      bottom: 30px;
      left: 30px;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--glass-bg);
      backdrop-filter: var(--glass-blur);
      border: var(--glass-border);
      color: var(--text);
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 998;
      box-shadow: var(--card-shadow);
      transition: transform 0.2s ease, background 0.2s ease;
    }

    .theme-toggle {
      position: fixed;
      top: 70px;
      right: 15px;
      z-index: 1001;
      filter: drop-shadow(0 10px 15px rgba(0,0,0,0.3));
      transform: scale(0.8);
      transform-origin: top right;
      cursor: pointer;
    }
    @media (min-width: 768px) { .theme-toggle { top: 80px; right: 30px; transform: scale(1); } }
    .lamp-scene { perspective: 1000px; }
    .lamp-wrap {
      transform-origin: top center;
      animation: swing 4s ease-in-out infinite;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .wire { width: 2px; height: 50px; background: linear-gradient(#9ca3af, #4b5563); margin-bottom: 2px; }
    @media (min-width: 768px) { .wire { height: 60px; } }
    .lamp-head {
      width: 60px;
      height: 40px;
      background: linear-gradient(#6b7280, #1f2937);
      border-radius: 30px 30px 8px 8px;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      margin-bottom: 5px;
    }
    @media (min-width: 768px) { .lamp-head { width: 80px; height: 50px; } }
    .bulb {
      width: 18px;
      height: 18px;
      background: radial-gradient(circle at 30% 30%, var(--lamp-color), color-mix(in srgb, var(--lamp-color) 50%, #333));
      border-radius: 50%;
      box-shadow: 0 0 20px var(--lamp-color);
      margin-bottom: 6px;
      transition: background 0.3s, box-shadow 0.3s;
    }
    @media (min-width: 768px) { .bulb { width: 24px; height: 24px; box-shadow: 0 0 25px var(--lamp-color); } }
    body.light-mode .bulb {
      background: radial-gradient(circle at 30% 30%, var(--lamp-off-color), color-mix(in srgb, var(--lamp-off-color) 40%, #444));
      box-shadow: 0 0 15px var(--lamp-off-color);
    }
    .beam {
      width: 120px;
      height: 100px;
      background: radial-gradient(ellipse at top, var(--lamp-color) 0%, transparent 70%);
      clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
      filter: blur(6px);
      opacity: 0.5;
      margin-top: -15px;
    }
    @media (min-width: 768px) { .beam { width: 180px; height: 140px; filter: blur(8px); margin-top: -20px; } }
    body.light-mode .beam {
      background: radial-gradient(ellipse at top, var(--lamp-off-color) 0%, transparent 70%);
      opacity: 0.3;
    }
    .floor {
      width: 150px;
      height: 70px;
      background: radial-gradient(circle, var(--lamp-color) 0%, transparent 70%);
      filter: blur(15px);
      opacity: 0.3;
      margin-top: -40px;
    }
    @media (min-width: 768px) { .floor { width: 200px; height: 100px; filter: blur(20px); margin-top: -60px; } }
    body.light-mode .floor {
      background: radial-gradient(circle, var(--lamp-off-color) 0%, transparent 70%);
      opacity: 0.15;
    }
    @keyframes swing { 0% { transform: rotate(4deg); } 50% { transform: rotate(-4deg); } 100% { transform: rotate(4deg); } }

    /* Header */
    header {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: var(--header-bg);
      backdrop-filter: var(--glass-blur);
      border-bottom: var(--glass-border);
      padding: 12px 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.05);
    }
    @media (min-width: 768px) { header { padding: 16px 24px; } }
    .header-inner {
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px;
    }
    .header-left { display: flex; align-items: center; gap: 15px; }
    .header-left .logo-img { height: 40px; width: auto; }
    .header-left .logo-text {
      font-family: 'Clash Display', sans-serif;
      font-weight: 700;
      font-size: 24px;
      letter-spacing: -0.5px;
    }
    .header-left .logo-text span:last-child { color: var(--accent); }
    .header-nav {
      display: flex;
      gap: 12px;
      background: rgba(0,0,0,0.2);
      backdrop-filter: blur(4px);
      padding: 6px 16px;
      border-radius: 60px;
      border: var(--glass-border);
    }
    body.light-mode .header-nav { background: rgba(255,255,255,0.5); }
    .nav-link {
      font-weight: 600;
      font-size: 14px;
      padding: 8px 14px;
      border-radius: 40px;
      transition: 0.2s;
      color: var(--text);
      text-decoration: none;
    }
    .nav-link:hover {
      background: var(--accent);
      color: #000;
      transform: translateY(-2px);
    }
    .header-logos {
      display: flex;
      gap: 12px;
      align-items: center;
    }
    @media (min-width: 768px) { .header-logos { gap: 20px; } }
    .header-logos img {
      width: 20px;
      transition: var(--transition);
    }
    body:not(.light-mode) .header-logos img { filter: invert(1); opacity: 0.7; }
    body.light-mode .header-logos img { filter: none; opacity: 0.8; }
    .header-logos img:hover { opacity: 1; transform: translateY(-2px); }
    @media (max-width: 680px) {
      .header-inner { flex-direction: column; align-items: stretch; }
      .header-nav { justify-content: center; order: 2; }
      .header-logos { order: 3; justify-content: center; }
    }

    /* PC Builder specific */
    .builder-section {
      max-width: 1400px;
      margin: 0 auto;
      padding: 40px 24px;
    }
    .builder-title {
      font-size: 32px;
      font-weight: 800;
      font-family: 'Clash Display', sans-serif;
      text-align: center;
      margin-bottom: 8px;
      color: var(--text);
    }
    .builder-subtitle {
      text-align: center;
      color: var(--muted);
      margin-bottom: 40px;
      font-size: 14px;
    }
    .components-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 24px;
      margin-bottom: 40px;
    }
    .component-card {
      background: var(--card-bg);
      backdrop-filter: var(--glass-blur);
      border: var(--glass-border);
      border-radius: 24px;
      padding: 20px;
      transition: var(--transition);
      box-shadow: var(--card-shadow);
    }
    .component-card:hover {
      transform: translateY(-4px);
      border-color: var(--accent);
      background: var(--card-hover);
    }
    .component-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-color);
    }
    .component-header i {
      font-size: 28px;
      color: var(--accent);
    }
    .component-header h3 {
      font-size: 20px;
      font-weight: 700;
      color: var(--text);
    }
    .component-select {
      width: 100%;
      padding: 12px 16px;
      border-radius: 16px;
      border: var(--glass-border);
      background: var(--glass-bg);
      color: var(--text);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      outline: none;
      transition: 0.2s;
      appearance: none;

      background-position: right 16px center;
    }
    .component-select:hover, .component-select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(255,216,77,0.2);

      backdrop-filter: var(--glass-blur);
      border: var(--glass-border);
      border-radius: 24px;
      padding: 24px;
      text-align: center;
      margin-bottom: 30px;
    }

      font-size: 18px;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 8px;
    }

      font-size: 48px;
      font-weight: 800;
      color: var(--accent);
      font-family: 'Clash Display', sans-serif;

      background: var(--accent);
      color: #000;
      border: none;
      padding: 16px 32px;
      border-radius: 60px;
      font-weight: 700;
      font-size: 18px;
      cursor: pointer;
      width: 100%;
      transition: transform 0.2s, background 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }
    .quote-btn i { font-size: 20px; }
    .quote-btn:hover {
      background: var(--accent-dark);
      transform: translateY(-2px);
    }
    .back-to-top {
      position: fixed;
      bottom: 30px;
      right: 30px;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: var(--accent);
      color: #000;
      border: none;
      font-size: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease, visibility 0.3s ease;

      box-shadow: 0 4px 15px rgba(0,0,0,0.3);

    footer {

      padding: 30px 20px;
      color: var(--muted);
      font-size: 13px;
      border-top: 1px solid var(--border-color);
    }

      .components-grid { grid-template-columns: 1fr; }
      .total-price { font-size: 36px; }
      .builder-title { font-size: 26px; }
    }
  </style>
</head>

  // Component categories with placeholder option
  const categories = {
    cpu: { name: "CPU", icon: "fas fa-microchip", filter: (p) => p.c === "cpu" },
    motherboard: { name: "Motherboard", icon: "fas fa-microchip", filter: (p) => p.c === "motherboard" },
    gpu: { name: "GPU", icon: "fas fa-tv", filter: (p) => p.c === "gpu" },
    ram: { name: "RAM", icon: "fas fa-memory", filter: (p) => p.c === "ram" },
    storage: { name: "Storage", icon: "fas fa-hdd", filter: (p) => p.c === "storage" },
    psu: { name: "Power Supply", icon: "fas fa-plug", filter: (p) => p.c === "psu" },
    cooler: { name: "CPU Cooler", icon: "fas fa-fan", filter: (p) => p.c === "cooler" }
  };

  function buildComponents() {
    const grid = document.getElementById('componentsGrid');
    grid.innerHTML = '';
    for (const [key, cat] of Object.entries(categories)) {
      const options = PRODUCTS.filter(cat.filter).map(p => ({ name: p.n, price: p.p }));
      if (options.length === 0) continue;
      
      const card = document.createElement('div');
      card.className = 'component-card';
      // Add placeholder option with value="" and price 0
      let optionsHtml = `<option value="" data-price="0">-- Select ${cat.name} --</option>`;
      options.forEach((opt, idx) => {
        optionsHtml += `<option value="${idx}" data-price="${opt.price}">${opt.name} - RM${opt.price}</option>`;
      });
      card.innerHTML = `
        <div class="component-header">
          <i class="${cat.icon}"></i>
          <h3>${cat.name}</h3>
        </div>
        <select class="component-select" id="select-${key}">
          ${optionsHtml}
        </select>
      `;
      grid.appendChild(card);
      card.optionsData = options;
    }
    // Attach change listeners
    for (const key in categories) {
      const select = document.getElementById(`select-${key}`);
      if (select) select.addEventListener('change', updateTotal);
    }
    updateTotal();
  }

  function updateTotal() {
    let total = 0;
    for (const key in categories) {
      const select = document.getElementById(`select-${key}`);
      if (select && select.options[select.selectedIndex]) {
        const price = parseInt(select.options[select.selectedIndex].getAttribute('data-price'));
        if (!isNaN(price)) total += price;
      }
    }
    document.getElementById('totalPrice').innerText = `RM${total}`;
  }

  function getQuoteMessage() {
    let message = "*Custom PC Build Request*%0A";
    let hasSelection = false;
    for (const key in categories) {
      const select = document.getElementById(`select-${key}`);
      if (select && select.selectedIndex > 0) { // skip placeholder
        const text = select.options[select.selectedIndex].text;
        message += `- ${categories[key].name}: ${text}%0A`;
        hasSelection = true;
      }
    }
    if (!hasSelection) {
      return "Hi FAZGAME, I'm interested in building a custom PC. Please help me with a quote.";
    }
    const total = document.getElementById('totalPrice').innerText;
    message += `%0A*Estimated Total: ${total}*%0A%0AHi FAZGAME, I would like to get a quote for this configuration. Please confirm availability and final price.`;
    return message;
  }

  document.getElementById('quoteBtn').addEventListener('click', () => {
    const msg = getQuoteMessage();
    window.open(`https://api.whatsapp.com/send?phone=60163691936&text=${msg}`, '_blank');
  });

  // ===== MUSIC & LAMP (same as index) =====
  const bgMusic = document.getElementById('bg-music');
  const musicToggle = document.getElementById('musicToggle');
  const autoplayHint = document.getElementById('autoplayHint');
  let musicStarted = false;
  function updateMusicIcon() { musicToggle.innerHTML = bgMusic.muted ? '🔇' : '🎵'; }
  function startMusic() {
    if (musicStarted) return;
    bgMusic.muted = false;
    bgMusic.loop = true;
    bgMusic.play().then(() => {
      musicStarted = true;
      updateMusicIcon();
      if (autoplayHint) autoplayHint.classList.remove('show');
    }).catch(err => console.warn("startMusic error:", err));
  }
  bgMusic.muted = false;
  bgMusic.play().then(() => { musicStarted = true; updateMusicIcon(); }).catch(() => {
    if (autoplayHint) autoplayHint.classList.add('show');
    const startOnInteraction = () => { startMusic(); document.removeEventListener('click', startOnInteraction); document.removeEventListener('touchstart', startOnInteraction); };
    document.addEventListener('click', startOnInteraction);
    document.addEventListener('touchstart', startOnInteraction);
  });
  musicToggle.addEventListener('click', (e) => {
    e.stopPropagation();
    if (!musicStarted) { startMusic(); return; }
    bgMusic.muted = !bgMusic.muted;
    updateMusicIcon();
  });

  // Theme toggle (lamp)
  const themeToggle = document.getElementById('themeToggle');
  const lampWrap = document.getElementById('lampWrap');
  if (localStorage.getItem('theme') === 'light') document.body.classList.add('light-mode');
  themeToggle.addEventListener('click', () => {
    if (lampWrap) {
      lampWrap.style.transition = 'transform 0.1s';
      lampWrap.style.transform = 'rotate(0deg) scale(0.98)';
      setTimeout(() => {
        lampWrap.style.transform = '';
        lampWrap.style.transition = '';
      }, 150);
    }
    document.body.classList.toggle('light-mode');
    localStorage.setItem('theme', document.body.classList.contains('light-mode') ? 'light' : 'dark');
  });

  // Back to top
  const backToTop = document.getElementById('backToTop');
  window.addEventListener('scroll', () => backToTop.classList.toggle('visible', window.scrollY > 200));
  backToTop.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));

  buildComponents();
</script>
