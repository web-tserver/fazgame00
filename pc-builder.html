<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>FAZGAME | Custom PC Builder</title>
  <meta name="description" content="Build your dream gaming PC with FAZGAME. Select CPU, GPU, RAM, storage and get an estimated quote.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link href="https://api.fontshare.com/v2/css?f[]=clash-display@400,700,600&display=swap" rel="stylesheet">
  <style>
    /* ===== RESET & BASE (same as index) ===== */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: 'Inter', sans-serif; 
      background: var(--bg); 
      color: var(--text); 
      overflow-x: hidden; 
      line-height: 1.5;
      transition: background 0.3s, color 0.2s;
    }
    a { text-decoration: none; color: inherit; }

    /* ===== THEME VARIABLES ===== */
    :root {
      --bg: #0b0b0f;
      --bg-secondary: #111216;
      --card-bg: rgba(20, 22, 27, 0.4);
      --text: #fff;
      --muted: #a0a0b0;
      --accent: #ffd84d;
      --accent-dark: #e6c43d;
      --border-color: rgba(255,255,255,0.08);
      --glass-blur: blur(20px);
      --glass-border: 1px solid rgba(255,255,255,0.06);
      --glass-bg: rgba(20, 22, 27, 0.3);
      --card-shadow: 0 8px 32px rgba(0,0,0,0.15);
      --header-bg: rgba(11, 11, 15, 0.5);
    }
    body.light-mode {
      --bg: #f0f4f8;
      --bg-secondary: #ffffff;
      --card-bg: rgba(255, 255, 255, 0.8);
      --text: #0f172a;
      --muted: #334155;
      --accent: #eab308;
      --accent-dark: #ca8a04;
      --border-color: rgba(0,0,0,0.08);
      --glass-border: 1px solid rgba(0,0,0,0.06);
      --glass-bg: rgba(255, 255, 255, 0.7);
      --card-shadow: 0 8px 32px rgba(0,0,0,0.05);
      --header-bg: rgba(255, 255, 255, 0.7);
    }

    /* ===== HEADER ===== */
    header {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: var(--header-bg);
      backdrop-filter: var(--glass-blur);
      border-bottom: var(--glass-border);
      padding: 12px 16px;
    }
    .header-inner {
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 15px;
    }
    .header-left .logo-img { height: 40px; width: auto; }
    .header-left .logo-text {
      font-family: 'Clash Display', sans-serif;
      font-weight: 700;
      font-size: 24px;
    }
    .header-left .logo-text span:last-child { color: var(--accent); }
    .header-nav {
      display: flex;
      gap: 12px;
      background: rgba(0,0,0,0.2);
      backdrop-filter: blur(4px);
      padding: 6px 16px;
      border-radius: 60px;
      border: var(--glass-border);
    }
    .nav-link {
      font-weight: 600;
      font-size: 14px;
      padding: 8px 14px;
      border-radius: 40px;
      transition: 0.2s;
      color: var(--text);
    }
    .nav-link:hover {
      background: var(--accent);
      color: #000;
      transform: translateY(-2px);
    }
    @media (max-width: 680px) {
      .header-inner { flex-direction: column; align-items: stretch; }
      .header-nav { justify-content: center; order: 2; }
      .header-logos { order: 3; justify-content: center; }
    }
    .header-logos { display: flex; gap: 12px; align-items: center; }
    .header-logos img { width: 20px; filter: invert(1); opacity: 0.6; transition: 0.2s; }
    .header-logos img:hover { opacity: 1; transform: translateY(-2px); }

    /* ===== LAMP THEME TOGGLE ===== */
    .theme-toggle {
      position: fixed;
      top: 70px;
      right: 15px;
      z-index: 1001;
      transform: scale(0.8);
      filter: drop-shadow(0 10px 15px rgba(0,0,0,0.3));
    }
    @media (min-width: 768px) { .theme-toggle { top: 80px; right: 30px; transform: scale(1); } }
    .lamp-scene { perspective: 1000px; }
    .lamp-wrap {
      transform-origin: top center;
      animation: swing 4s ease-in-out infinite;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .wire { width: 2px; height: 50px; background: linear-gradient(#9ca3af, #4b5563); margin-bottom: 2px; }
    .lamp-head {
      width: 60px;
      height: 40px;
      background: linear-gradient(#6b7280, #1f2937);
      border-radius: 30px 30px 8px 8px;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      margin-bottom: 5px;
    }
    .bulb {
      width: 18px;
      height: 18px;
      background: radial-gradient(circle at 30% 30%, var(--accent), #333);
      border-radius: 50%;
      box-shadow: 0 0 20px var(--accent);
      margin-bottom: 6px;
    }
    body.light-mode .bulb {
      background: radial-gradient(circle at 30% 30%, #64748b, #444);
      box-shadow: 0 0 15px #64748b;
    }
    .beam {
      width: 120px;
      height: 100px;
      background: radial-gradient(ellipse at top, var(--accent), transparent 70%);
      clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
      filter: blur(6px);
      opacity: 0.5;
      margin-top: -15px;
    }
    .floor {
      width: 150px;
      height: 70px;
      background: radial-gradient(circle, var(--accent), transparent 70%);
      filter: blur(15px);
      opacity: 0.3;
      margin-top: -40px;
    }
    @keyframes swing { 0% { transform: rotate(4deg); } 50% { transform: rotate(-4deg); } 100% { transform: rotate(4deg); } }

    /* ===== PC BUILDER SPECIFIC ===== */
    .pc-builder-section {
      max-width: 1200px;
      margin: 40px auto;
      padding: 0 16px;
    }
    .pc-builder {
      background: var(--card-bg);
      backdrop-filter: var(--glass-blur);
      border-radius: 28px;
      padding: 32px;
      border: var(--glass-border);
      box-shadow: var(--card-shadow);
    }
    .builder-title {
      font-size: 32px;
      font-weight: 800;
      font-family: 'Clash Display', sans-serif;
      color: var(--accent);
      text-align: center;
      margin-bottom: 8px;
    }
    .builder-subtitle {
      text-align: center;
      color: var(--muted);
      margin-bottom: 32px;
    }
    .builder-group-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 24px;
      margin-bottom: 32px;
    }
    .builder-group label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--text);
    }
    .pc-builder-select {
      width: 100%;
      padding: 12px 16px;
      border-radius: 16px;
      background: var(--bg-secondary);
      color: var(--text);
      border: var(--glass-border);
      font-size: 14px;
      outline: none;
      transition: 0.2s;
    }
    .pc-builder-select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(255,216,77,0.2);
    }
    .total-price {
      text-align: center;
      font-size: 24px;
      font-weight: 800;
      margin: 32px 0 24px;
    }
    .total-price span {
      color: var(--accent);
      font-size: 32px;
    }
    .quote-btn {
      background: var(--accent);
      color: #000;
      border: none;
      padding: 14px 24px;
      border-radius: 60px;
      font-weight: 700;
      font-size: 16px;
      width: 100%;
      cursor: pointer;
      transition: transform 0.2s, background 0.2s;
    }
    .quote-btn:hover {
      background: var(--accent-dark);
      transform: translateY(-2px);
    }
    .back-to-top {
      position: fixed;
      bottom: 30px;
      right: 30px;
      width: 50px;
      height: 50px;
      background: var(--accent);
      color: #000;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      visibility: hidden;
      transition: 0.2s;
      cursor: pointer;
    }
    .back-to-top.visible { opacity: 1; visibility: visible; }
    .music-toggle {
      position: fixed;
      bottom: 30px;
      left: 30px;
      width: 44px;
      height: 44px;
      background: var(--glass-bg);
      backdrop-filter: blur(10px);
      border-radius: 50%;
      border: var(--glass-border);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 998;
      cursor: pointer;
    }
    footer {
      text-align: center;
      padding: 30px;
      border-top: 1px solid var(--border-color);
      color: var(--muted);
      margin-top: 40px;
    }
    @media (max-width: 480px) {
      .builder-title { font-size: 24px; }
      .pc-builder { padding: 20px; }
    }
  </style>
</head>
<body>

<audio id="bg-music" src="music/background.mp3" loop></audio>
<button class="music-toggle" id="musicToggle">🎵</button>
<div id="autoplayHint" style="position:fixed; bottom:100px; left:20px; background:rgba(0,0,0,0.7); padding:8px 16px; border-radius:40px; font-size:12px; display:none;">🎵 Tap anywhere to enable music</div>

<div id="preloader" style="position:fixed; inset:0; background:var(--bg); z-index:10000; display:flex; align-items:center; justify-content:center; transition:opacity 0.6s;">
  <div style="text-align:center;">
    <img src="images/logo1.png" alt="FAZGAME" style="width:100px;" onerror="this.src='https://placehold.co/100x100/222/ffd84d?text=FAZ';">
    <div style="font-family:'Clash Display'; font-size:32px;"><span>FAZ</span><span style="color:var(--accent)">GAME</span></div>
    <div style="width:200px; height:4px; background:#222; margin-top:20px; border-radius:10px;"><div id="loaderBar" style="height:100%; width:0%; background:var(--accent);"></div></div>
  </div>
</div>

<div class="theme-toggle" id="themeToggle"><div class="lamp-scene"><div class="lamp-wrap"><div class="wire"></div><div class="lamp-head"><div class="bulb"></div></div><div class="beam"></div><div class="floor"></div></div></div></div>
<div class="back-to-top" id="backToTop">↑</div>

<header>
  <div class="header-inner">
    <div class="header-left">
      <img src="images/logo1.png" class="logo-img" onerror="this.src='https://placehold.co/300x300/222/ffd84d?text=FAZGAME';">
      <div class="logo-text"><span>FAZ</span><span>GAME</span></div>
    </div>
    <div class="header-nav">
      <a href="index.html" class="nav-link">Home</a>
      <a href="pc-builder.html" class="nav-link">PC Builder</a>
      <a href="#" class="nav-link" id="navShop">Shop</a>
    </div>
    <div class="header-logos">
      <img src="https://api.iconify.design/simple-icons/playstation.svg" alt="PS">
      <img src="https://api.iconify.design/simple-icons/xbox.svg" alt="Xbox">
      <img src="https://api.iconify.design/simple-icons/nintendoswitch.svg" alt="Switch">
      <img src="https://api.iconify.design/mdi/desktop-classic.svg" alt="PC">
    </div>
  </div>
</header>

<div class="pc-builder-section">
  <div class="pc-builder">
    <h1 class="builder-title">🛠️ Custom PC Builder</h1>
    <div class="builder-subtitle">Select your components • Estimated price only. Final price may vary based on current market prices.</div>
    
    <div class="builder-group-list">
      <div class="builder-group">
        <label>CPU</label>
        <select class="pc-builder-select" id="cpuSelect">
          <option value="550">AMD Ryzen 5 5600 (RM550)</option>
          <option value="850">AMD Ryzen 7 5700X (RM850)</option>
          <option value="1200">AMD Ryzen 7 7800X3D (RM1200)</option>
        </select>
      </div>
      <div class="builder-group">
        <label>GPU</label>
        <select class="pc-builder-select" id="gpuSelect">
          <option value="900">RTX 3050 6GB (RM900)</option>
          <option value="1300">RTX 4060 8GB (RM1300)</option>
          <option value="1800">RTX 5060 Ti 8GB (RM1800)</option>
          <option value="2500">RTX 5070 12GB (RM2500)</option>
        </select>
      </div>
      <div class="builder-group">
        <label>RAM</label>
        <select class="pc-builder-select" id="ramSelect">
          <option value="250">16GB DDR4 (RM250)</option>
          <option value="450">32GB DDR4 (RM450)</option>
          <option value="600">32GB DDR5 (RM600)</option>
        </select>
      </div>
      <div class="builder-group">
        <label>Storage</label>
        <select class="pc-builder-select" id="storageSelect">
          <option value="180">512GB NVMe SSD (RM180)</option>
          <option value="280">1TB NVMe SSD (RM280)</option>
          <option value="450">2TB NVMe SSD (RM450)</option>
        </select>
      </div>
    </div>
    
    <div class="total-price">
      Estimated Total: <span id="totalPrice">RM0</span>
    </div>
    <button class="quote-btn" id="quoteBtn">Request Quote via WhatsApp</button>
  </div>
</div>

<footer>© 2026 FAZGAME • Faz Service, Faz Gaming</footer>

<script>
  (function(){
    // --- PC Builder Logic ---
    const cpuSelect = document.getElementById('cpuSelect');
    const gpuSelect = document.getElementById('gpuSelect');
    const ramSelect = document.getElementById('ramSelect');
    const storageSelect = document.getElementById('storageSelect');
    const totalSpan = document.getElementById('totalPrice');
    
    function updateTotal() {
      let total = 0;
      total += parseInt(cpuSelect.value) || 0;
      total += parseInt(gpuSelect.value) || 0;
      total += parseInt(ramSelect.value) || 0;
      total += parseInt(storageSelect.value) || 0;
      totalSpan.innerText = `RM${total}`;
    }
    
    cpuSelect.addEventListener('change', updateTotal);
    gpuSelect.addEventListener('change', updateTotal);
    ramSelect.addEventListener('change', updateTotal);
    storageSelect.addEventListener('change', updateTotal);
    updateTotal();
    
    document.getElementById('quoteBtn').addEventListener('click', () => {
      const cpu = cpuSelect.options[cpuSelect.selectedIndex].text;
      const gpu = gpuSelect.options[gpuSelect.selectedIndex].text;
      const ram = ramSelect.options[ramSelect.selectedIndex].text;
      const storage = storageSelect.options[storageSelect.selectedIndex].text;
      const total = totalSpan.innerText;
      const message = `Hi FAZGAME, I'd like a quote for a custom PC:%0A- CPU: ${cpu}%0A- GPU: ${gpu}%0A- RAM: ${ram}%0A- Storage: ${storage}%0A- Total estimate: ${total}%0A%0ACan you confirm final price and availability?`;
      window.open(`https://wa.me/60163691936?text=${message}`, '_blank');
    });
    
    // --- Music & Autoplay ---
    const music = document.getElementById('bg-music');
    const musicBtn = document.getElementById('musicToggle');
    const hint = document.getElementById('autoplayHint');
    music.volume = 0.4;
    music.play().catch(() => { if(hint) hint.style.display = 'block'; const enable = () => { music.play(); if(hint) hint.style.display = 'none'; document.removeEventListener('click', enable); }; document.addEventListener('click', enable); });
    musicBtn.onclick = () => { if(music.paused) music.play(); else music.pause(); musicBtn.innerHTML = music.paused ? '🔇' : '🎵'; };
    
    // --- Preloader ---
    let progress = 0;
    const bar = document.getElementById('loaderBar');
    const preloaderDiv = document.getElementById('preloader');
    const interval = setInterval(() => {
      progress += 5;
      if(bar) bar.style.width = progress + '%';
      if(progress >= 100) {
        clearInterval(interval);
        setTimeout(() => { preloaderDiv.style.opacity = '0'; setTimeout(() => preloaderDiv.style.display = 'none', 600); }, 400);
      }
    }, 40);
    
    // --- Theme Toggle ---
    const themeToggle = document.getElementById('themeToggle');
    if(localStorage.getItem('theme') === 'light') document.body.classList.add('light-mode');
    themeToggle.onclick = () => {
      document.body.classList.toggle('light-mode');
      localStorage.setItem('theme', document.body.classList.contains('light-mode') ? 'light' : 'dark');
    };
    
    // --- Back to Top ---
    const backTop = document.getElementById('backToTop');
    window.addEventListener('scroll', () => backTop.classList.toggle('visible', window.scrollY > 200));
    backTop.onclick = () => window.scrollTo({ top: 0, behavior: 'smooth' });
    
    // --- Shop placeholder ---
    document.getElementById('navShop').onclick = (e) => { e.preventDefault(); alert('🛒 Shop page coming soon!'); };
  })();
</script>
</body>
</html>
